<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Kokan meva</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .contact-heading {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 30px;
            color: #4db6ac;
        }

        .contact-section {
            margin-top: 40px;
        }

        .contact-form {
            background-color: #f8f9fa;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .contact-info {
            margin-top: 50px;
        }

        .contact-info h5 {
            font-size: 1.2rem;
            color: #4db6ac;
        }

        .contact-info p {
            font-size: 1.1rem;
        }

        .form-control {
            margin-bottom: 20px;
        }

        .btn-contact {
            background-color: #4db6ac;
            color: white;
        }
        .go-back-btn {
            display: block;
            margin: 50px auto;
            padding: 10px 20px;
            background-color: #4db6ac;
            color: white;
            font-size: 1.1rem;
            border: none;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            width: 150px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, transform 0.3s;
        }

        .go-back-btn:hover {
            background-color: #388e8e;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Contact Us Heading -->
        <h2 class="contact-heading text-center">Contact Us</h2>

        <div class="row contact-section">
            <!-- Contact Form -->
            <div class="col-md-8">
                <div class="contact-form">
                    <h4>Send Us a Message</h4>
                    <form action="your-server-endpoint" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" class="form-control" id="subject" name="subject" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Your Message</label>
                            <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-contact">Send Message</button>
                    </form>
                </div>
            </div>

            <!-- Contact Information -->
            <div class="col-md-4 contact-info">
                <h5>Contact Information</h5>
                <p><strong>Phone:</strong> +91 123 456 7890</p>
                <p><strong>Email:</strong> info@ratnagiritourism.com</p>
                <p><strong>Address:</strong> Ratnagiri Tourism Office, Beach Road, Ratnagiri, Maharashtra, India</p>
            </div>
        </div>
    </div>
    <a href="index.html"><button class="go-back-btn">Go Back</button></a>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>

</body>

</html>
